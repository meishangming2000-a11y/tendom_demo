stage1_semantic_groups:
  formal_main_visual_chain:
    assets: [pa_base_visual, pa_link_long_visual, pa_j3_link_visual, pa_j4_link_main_visual, pa_j4_link_aux_visual, pa_j4_link_cover_visual, pa_j5_fixed_support_visual, pa_mount_visual]
    note: current Stage 1 main visual chain is defined semantically; imported CAD visuals and body tree do not need a strict one_to_one mapping
  reference_candidate_visuals:
    assets: [pa_j5_rotating_output_candidate_visual]
    note: retained as a rotating_side reference visual and not the fixed_side primary meaning
  placeholder_logic_layers:
    assets: [pa_link_mid_visual]
    note: pa_j2_carriage remains a placeholder logic layer and does not block current Stage 1 structural validation
