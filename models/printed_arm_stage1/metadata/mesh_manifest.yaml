    asset_name: pa_base_visual
    stage1_visual_class: formal_main_visual
    current_file: assets/meshes/visual/pa_base.stl
    replacement_source: "printed assembly base export"
    source_file: hardwares/打印装配体/realtosim/PA_BASE.STL
    units: mm_export_scaled_to_m
    measured_bbox_mm: [65.0, 131.953, 132.0]
    visual_geom_pose_m:
      pos: [-0.581117, -0.066195, -1.289088]
      quat_wxyz: [1.0, 0.0, 0.0, 0.0]
    semantic_review:
      stage1_role: current_main_visual_chain_component
      chain_position: base
      note: pa_base is part of the current formal Stage 1 main visual chain
    orientation_note: assembly_frame_orientation_preserved
    stage1_status: imported_and_centered_on_existing_visual_slot
